# Menyiapkan model foto (encoder gambar CLIP dalam ONNX) lalu menaruhnya di rilis GitHub "model-v1".
# Dijalankan manual dari tab Actions > Siapkan model foto > Run workflow.
name: Siapkan model foto

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Pasang pustaka
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install open_clip_torch==4.2.2 onnx==1.23.2 onnxruntime==1.32.0 onnxscript pandas pillow

      - name: Ekspor dan kuantisasi model
        run: python tools/siapkan_model.py --repo "${{ github.repository }}" --rilis model-v1

      - name: Unggah ke rilis GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view model-v1 >/dev/null 2>&1 || gh release create model-v1 \
            --title "Model foto EcoDrop" \
            --notes "Encoder gambar OpenCLIP ViT-B/32 (LAION-400M) dalam format ONNX int8 untuk fitur pengenalan foto. Dibuat oleh tools/siapkan_model.py."
          gh release upload model-v1 model/visual.onnx --clobber

      - name: Simpan konfigurasi model ke repositori
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/teks.npy model/konfigurasi.json
          git diff --cached --quiet || (git commit -m "Perbarui konfigurasi model foto" && git push)
